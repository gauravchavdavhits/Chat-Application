          <h1>Real-Time Chat Application | Instant Messaging &amp; Calls</h1>
          <p>
            A responsive real-time messaging application built with React, TypeScript, Node.js, Express, Socket.IO, and MongoDB. Connect with friends and communities through instant messaging, live presence indicators, group chats, and WebRTC voice &amp; video calls.
          </p>

          <section>
            <h2>Production-Ready Communication Features</h2>
            <ul>
              <li><strong>Real-Time Direct Messaging:</strong> Instant delivery powered by persistent WebSocket sockets with typing indicators.</li>
              <li><strong>Live Presence &amp; Online Status:</strong> Dynamic online/offline presence tracking for all contacts.</li>
              <li><strong>WebRTC Voice &amp; Video Calling:</strong> High-fidelity audio and video calling directly in the browser with screen sharing.</li>
              <li><strong>Group Channels &amp; Collaboration:</strong> Multi-user group conversation rooms with real-time participation.</li>
              <li><strong>Message Editing &amp; Deletion:</strong> Full message lifecycle management across active chat sessions.</li>
              <li><strong>Media &amp; GIF Sharing:</strong> Integrated photo, file attachments, emojis, and Giphy animations.</li>
            </ul>
          </section>

          <section>
            <h2>Built with Modern Web Technologies</h2>
            <p>
              Socket.IO powers real-time bidirectional communication, while Node.js and Express provide the backend REST API. MongoDB stores application data, and React with TypeScript delivers the frontend user experience.
            </p>
          </section>

          <section>
            <h2>How the Chat Application Works</h2>
            <ol>
              <li>Create an account with a unique username and secure password.</li>
              <li>Sign in securely to browse contacts and active online users.</li>
              <li>Select a conversation, send instant messages, or initiate a voice/video call.</li>
            </ol>
          </section>

          <section>
            <h2>Security &amp; Architecture</h2>
